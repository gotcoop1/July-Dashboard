<title>TSC Campus Readiness Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: readiness desk. Sticky nav; dashboards lead with status; everything keys off each room's next scheduled use. */
/* Thompson Station Church brand — Orange #F36C42, Charcoal #3C4244, Gray #4F5659, Blue #72A8B8, Cream #DED7CC. Type: Montserrat. */
:root{
  --bg:#F4F1EC; --surface:#FFFFFF; --sunk:#EFEAE1; --line:#DED7CC; --ink:#2A2E30; --ink-2:#4F5659; --ink-3:#8A8F8C;
  --accent:#F36C42; --accent-ink:#FFFFFF; --accent-soft:#FBE3D9;
  --c-ministry:#3F8EA3; --c-event:#7A5AA6; --c-reset:#B5468A; --c-maint:#C2612A; --c-pm:#3F7D5F; --c-inspect:#5A6FD6; --c-service:#2E8E8E;
  --ready:#2E7D4F; --ready-bg:#DDEFE0; --wip:#B7791F; --wip-bg:#F7EAD2; --bad:#C0392B; --bad-bg:#F7DED9; --gray:#8A8F8C; --gray-bg:#EFEAE1;
  --f-display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161A1B; --surface:#1E2325; --sunk:#262C2E; --line:#353C3E; --ink:#ECEAE4; --ink-2:#B4BBBC; --ink-3:#8C9390;
  --accent:#F58257; --accent-ink:#1E1109; --accent-soft:#3A271D;
  --c-ministry:#72A8B8; --c-event:#A98FD6; --c-reset:#E07BBE; --c-maint:#E3904C; --c-pm:#5FB98A; --c-inspect:#8A9BEC; --c-service:#4FB5B5;
  --ready:#5FC08A; --ready-bg:#17352566; --wip:#E3B355; --wip-bg:#3A2F1566; --bad:#EE6B6B; --bad-bg:#3A1C1C66; --gray:#8C9390; --gray-bg:#262C2E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161A1B; --surface:#1E2325; --sunk:#262C2E; --line:#353C3E; --ink:#ECEAE4; --ink-2:#B4BBBC; --ink-3:#8C9390;
  --accent:#F58257; --accent-ink:#1E1109; --accent-soft:#3A271D;
  --c-ministry:#72A8B8; --c-event:#A98FD6; --c-reset:#E07BBE; --c-maint:#E3904C; --c-pm:#5FB98A; --c-inspect:#8A9BEC; --c-service:#4FB5B5;
  --ready:#5FC08A; --ready-bg:#17352566; --wip:#E3B355; --wip-bg:#3A2F1566; --bad:#EE6B6B; --bad-bg:#3A1C1C66; --gray:#8C9390; --gray-bg:#262C2E;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:23px;font-weight:700}h3{font-size:16px;font-weight:600}h4{font-size:14px;font-weight:600}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.muted{color:var(--ink-3)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.tnum{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px}
.brand h1{font-size:18px;font-weight:700;line-height:1.05}
.brand small{display:block;font-size:11px;color:var(--ink-3);font-family:var(--f-body)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 10px;border-radius:5px;text-decoration:none;color:var(--ink-2);font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center;font-size:13.5px}
nav.tabs a:hover{background:var(--sunk);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.who{font-size:12px;color:var(--ink-3);white-space:nowrap;display:flex;gap:8px;align-items:center}
.banner{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line);color:var(--ink-2);font-size:13px}
.banner.warn{border-color:var(--wip)}
main{padding-block:20px 72px}
.view-head{display:flex;align-items:flex-end;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.view-head p{margin:4px 0 0;color:var(--ink-2);max-width:70ch}

.btn{text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line)}
.tile:hover{border-color:var(--ink-3)}
.tile .n{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.tile .t{font-size:12px;color:var(--ink-2)}
.tile.ok{border-top-color:var(--ready)}.tile.ok .n{color:var(--ready)}
.tile.warn{border-top-color:var(--wip)}.tile.warn .n{color:var(--wip)}
.tile.bad{border-top-color:var(--bad)}.tile.bad .n{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:16px;align-content:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-b{padding:4px 0}
.empty{padding:22px 16px;color:var(--ink-3);text-align:center;font-size:13px}
.empty strong{display:block;color:var(--ink-2);margin-bottom:4px}

.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media (max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--sunk);border-radius:var(--r);padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--stripe,var(--line));border-radius:5px;padding:8px 10px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:3px}
.card:hover{border-color:var(--ink-3)}
.card .ttl{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .meta{font-size:12px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap}
.more{font-size:12px;color:var(--ink-3);padding:4px}

.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .sub{font-size:12px;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--dot,var(--ink-3));flex:none}
.dot.rd{border-radius:50%}

.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid currentColor}
.s-ready{color:var(--ready)}.s-wip{color:var(--wip)}.s-bad{color:var(--bad)}.s-gray{color:var(--gray)}
.chipstat{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600}
.chipstat.ready{background:var(--ready-bg);color:var(--ready)}
.chipstat.wip{background:var(--wip-bg);color:var(--wip)}
.chipstat.bad{background:var(--bad-bg);color:var(--bad)}
.chipstat.gray{background:var(--gray-bg);color:var(--ink-3)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.filters input,.filters select{padding:6px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.filters input[type=search]{flex:1;min-width:160px}

.cal-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cal-bar h3{font-size:20px;min-width:170px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.chip[aria-pressed="false"]{opacity:.45}
.chip .dot{--dot:var(--k)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--sunk);padding:6px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.day{background:var(--surface);min-height:120px;padding:4px 4px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.day.out{background:var(--bg)}.day.out .dn{color:var(--ink-3)}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:4px}
.day.sun{background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.dn{font-size:12px;font-weight:600;padding:1px 5px;align-self:flex-start;background:none;border:0;cursor:pointer}
.ev{display:block;width:100%;text-align:left;font-size:11.5px;line-height:1.3;padding:2px 5px;border-radius:3px;border:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--k) 16%,var(--surface));color:var(--ink);border-left:3px solid var(--k)}
.ev.done{text-decoration:line-through;opacity:.6}
.ev.urgent{box-shadow:inset 0 0 0 1px var(--bad)}
.ev .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);margin-right:3px}
.ev-more{font-size:11px;color:var(--ink-3);background:none;border:0;cursor:pointer;text-align:left;padding:1px 5px}
.agenda{display:flex;flex-direction:column;gap:12px}
.ag-day h4{margin:0 0 6px;color:var(--ink-2)}
.ag-day .ev{white-space:normal;font-size:13px;padding:6px 8px;margin-bottom:4px}
.cal-src{font-size:12px;color:var(--ink-3);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.form{display:grid;gap:16px;max-width:820px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
@media (max-width:640px){.seg{grid-template-columns:minmax(0,1fr)}}
.seg label{border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.seg label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.seg input{margin-top:3px;accent-color:var(--accent)}
.seg b{display:block;font-family:var(--f-display);font-size:16px}
.seg span{font-size:13px;color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:600px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:600;color:var(--ink-2)}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);width:100%}
.f textarea{min-height:84px;resize:vertical}
.f .hint{font-size:12px;color:var(--ink-3)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0;background:var(--surface)}
legend{font-family:var(--f-display);font-weight:600;font-size:15px;padding:0 6px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--ink-3);cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink-2)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:88px;height:88px;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:11px;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.routing-note{font-size:13px;color:var(--ink-2);background:var(--sunk);border-radius:var(--r);padding:10px 12px}
.check{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.check .ct{flex:1;min-width:0}
.check.done .ct{color:var(--ink-3);text-decoration:line-through}

.scrim{position:fixed;inset:0;background:rgba(10,16,13,.5);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(640px,100%);height:100%;background:var(--surface);overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}
.d-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.d-head h2{font-size:21px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:135px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.steps{display:flex;gap:0;margin:2px 0;flex-wrap:wrap}
.step{flex:1;min-width:60px;text-align:center;font-size:11px;color:var(--ink-3);position:relative;padding-top:16px}
.step::before{content:"";position:absolute;top:4px;left:50%;width:10px;height:10px;border-radius:5px;transform:translateX(-50%);background:var(--line);z-index:1}
.step::after{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::after{display:none}
.step.done{color:var(--ink)}.step.done::before,.step.done::after{background:var(--accent)}
.step.cur{color:var(--ink);font-weight:600}.step.cur::before{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.actions{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r);background:var(--sunk)}
.hist{display:flex;flex-direction:column;gap:8px;font-size:13px;border-left:2px solid var(--line);padding-left:12px}
.hist .h-at{font-size:11.5px;color:var(--ink-3)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photos a{display:block;aspect-ratio:1;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;font-size:13px;max-width:min(92vw,520px)}
.picker{position:relative}
.picker .res{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line);border-radius:5px;z-index:5;max-height:220px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.picker .res button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;cursor:pointer}
.picker .res button:hover{background:var(--sunk)}
.picked{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:4px;flex-wrap:wrap}
.notif{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.notif.unread{background:color-mix(in srgb,var(--accent-soft) 60%,var(--surface))}
.notif .txt{overflow-wrap:anywhere}
.readybar{height:10px;border-radius:5px;background:var(--gray-bg);overflow:hidden;display:flex}
.readybar i{display:block;height:100%}
.roomcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;cursor:pointer;border-left:4px solid var(--stripe,var(--gray))}
.roomcard:hover{border-color:var(--ink-3)}
.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.sun-sec h3{margin-bottom:8px}
.pct{font-family:var(--f-display);font-weight:700}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">TSC</div>
      <div><h1>Campus Readiness Hub</h1><small>Thompson Station Church</small></div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#dashboard" data-v="dashboard">Dashboard</a>
      <a href="#sunday" data-v="sunday">Sunday Readiness</a>
      <a href="#mytasks" data-v="mytasks">My Tasks <span class="badge" id="myBadge" hidden>0</span></a>
      <a href="#request" data-v="request">Submit</a>
      <a href="#workorders" data-v="workorders">Work Orders</a>
      <a href="#calendar" data-v="calendar">Calendar</a>
      <a href="#rooms" data-v="rooms">Rooms</a>
      <a href="#inspections" data-v="inspections">Inspections</a>
      <a href="#preventive" data-v="preventive">Preventive</a>
      <a href="#reports" data-v="reports">Reports</a>
      <a href="#inbox" data-v="inbox">Inbox <span class="badge" id="inboxBadge" hidden>0</span></a>
      <a href="#routing" data-v="routing">Setup</a>
    </nav>
    <div class="who" id="who"></div>
  </div>
</header>
<main class="wrap">
  <div id="globalBanner"></div>
  <section id="v-dashboard" data-view></section>
  <section id="v-sunday" data-view hidden></section>
  <section id="v-mytasks" data-view hidden></section>
  <section id="v-request" data-view hidden></section>
  <section id="v-workorders" data-view hidden></section>
  <section id="v-calendar" data-view hidden></section>
  <section id="v-rooms" data-view hidden></section>
  <section id="v-inspections" data-view hidden></section>
  <section id="v-preventive" data-view hidden></section>

/* ============ Planning Center ============ */
function pcoEventsFor(mk){const l=S.pcoLive[mk];if(l)return l.events;const d=S.pcoDocs[mk];return d?d.events||[]:[]}
function pcoFreshness(mk){const l=S.pcoLive[mk];if(l)return{at:l.at,src:"live"};const d=S.pcoDocs[mk];return d?{at:d.fetchedAt,src:"saved"}:null}
function allPcoEvents(){const seen={},out=[];Object.keys(S.pcoLive).concat(Object.keys(S.pcoDocs)).forEach(mk=>pcoEventsFor(mk).forEach(e=>{if(!seen[e.id]){seen[e.id]=1;out.push(e)}}));return out}
async function autoLoadPco(){if(!S.mcp)return;let st="prompt";try{st=S.perms?await S.perms.state("mcp:"+PCO).catch(()=>"unavailable"):"prompt"}catch(e){}
  if(st==="granted"){const n=new Date();ensureMonth(monthKey(n));const nx=new Date();nx.setMonth(nx.getMonth()+1,1);ensureMonth(monthKey(nx))}else{S.pcoState._needsClick=true;renderAll()}}
async function ensureMonth(mk,click){
  if(!S.mcp){S.pcoState[mk]={err:"none"};return}
  if(S.pcoLive[mk]||(S.pcoState[mk]&&S.pcoState[mk].loading))return;
  if(!click&&S.pcoState._needsClick)return;
  S.pcoState[mk]={loading:true};renderAll();
  const[y,m]=mk.split("-").map(Number);const start=new Date(y,m-1,1),end=new Date(y,m,0);
  const events=[];let page=null,guard=0;
  try{do{
    const input={starts_at_start:ymd(addDays(start,-1)),starts_at_end:ymd(addDays(end,1)),per_page:100,kind:"standard",order_by:"starts_at",output_fields:["id","name","starts_at","ends_at","all_day_event","location","church_center_url"]};
    if(page)input.page_after=page;
    const res=await S.mcp.callTool(PCO,PCO_TOOL,input,{cache:{staleTime:600000,gcTime:86400000}});
    const p=res.payload||{};(p.data||[]).forEach(it=>{const a=it.attributes||{};events.push({id:it.id,n:(a.name||"").slice(0,120),s:a.starts_at,e:a.ends_at,ad:!!a.all_day_event,l:(a.location||"").split(" - ")[0].slice(0,80),u:a.church_center_url||""})});
    page=p.has_more?p.next_page_token:null;
  }while(page&&++guard<10);
    const inMonth=events.filter(e=>{const d=new Date(e.s);return d>=start&&d<addDays(end,1)});
    S.pcoLive[mk]={events:inMonth,at:Date.now()};S.pcoState[mk]={ok:true};S.pcoState._needsClick=false;
    const prev=S.pcoDocs[mk];const sig=JSON.stringify(inMonth);
    if(S.db&&(!prev||JSON.stringify(prev.events||[])!==sig))S.db.doc("pco/"+mk).set({events:inMonth,fetchedAt:Date.now()}).catch(()=>{});
  }catch(e){S.pcoState[mk]={err:(e&&e.code)||"upstream_error"}}
  renderAll();if(S.view==="request"&&$("#rPco"))fillPcoOptions($("#rPco").value);
}
function pcoNote(mk){
  const st=S.pcoState[mk]||{};const f=pcoFreshness(mk);
  const fresh=f?(f.src==="live"?"Ministry calendar from Planning Center, updated "+ago(f.at):"Showing the saved ministry calendar from "+ago(f.at)):"";
  if(!S.mcp)return fresh||"Ministry events appear once someone with Planning Center connected opens the calendar.";
  if(st.loading)return "Loading the ministry calendar from Planning Center…";
  if(S.pcoState._needsClick&&!S.pcoLive[mk])return (fresh?fresh+". ":"")+'<button class="btn sm" data-act="pco-load">Load live ministry calendar</button>';
  const map={server_not_connected:"Add Planning Center in claude.ai Settings → Connectors to load events.",needs_reauth:"Reconnect Planning Center in claude.ai Settings → Connectors.",not_in_manifest:"Planning Center is turned off for this page (Permissions menu).",approval_required:'Planning Center needs your approval. <button class="btn sm" data-act="pco-load">Allow and load</button>',selection_required:"Choose which Planning Center connection when asked.",blocked_by_policy:"Your organization's policy blocks Planning Center here.",server_unavailable:'Planning Center didn\'t answer. <button class="btn sm" data-act="pco-load">Try again</button>'};
  if(st.err&&st.err!=="none")return (map[st.err]||('Planning Center error. <button class="btn sm" data-act="pco-load">Try again</button>'))+(fresh?" "+fresh+".":"");

/* ============ readiness engine ============ */
// events that touch a room: event_setup requests + ministry events whose location matches the room
function roomUsesOn(roomId,fromYmd){
  const r=room(roomId);if(!r)return[];const uses=[];
  S.requests.forEach(x=>{if(x.type==="event_setup"&&x.roomId===roomId&&x.eventDate&&!["declined"].includes(x.status))uses.push({date:x.eventDate,label:x.title,kind:"event_setup",ref:x.id,changes:x.changesConfig})});
  if(r.name)allPcoEvents().forEach(e=>{if((e.l||"").toLowerCase().includes(r.name.toLowerCase())){const d=ymd(new Date(e.s));uses.push({date:d,label:e.n,kind:"ministry",ref:e.id})}});
  return uses.filter(u=>!fromYmd||u.date>=fromYmd).sort((a,b)=>a.date.localeCompare(b.date));
}
function roomNextUse(roomId){const u=roomUsesOn(roomId,todayYmd());const r=room(roomId);
  let next=u[0]?u[0].date:null;
  if(r&&r.sundayRequired){const sun=thisOrNextSunday();if(!next||sun<next)return{date:sun,label:"Sunday services",kind:"readiness"};}
  return u[0]||null;}
// readiness: bad if open high/urgent issue in room, or pending reset/setup overdue or due before next use; wip if open work; ready otherwise
function roomReadiness(rm){
  const issues=S.requests.filter(r=>r.roomId===rm.id&&isOpen(r));
  const blockers=issues.filter(r=>r.status==="blocked"||((r.priority==="urgent"||r.priority==="high")&&r.type==="problem"));
  const pendingReset=issues.filter(r=>r.type==="reset");
  const pendingSetup=issues.filter(r=>r.type==="event_setup");
  const next=roomNextUse(rm.id);
  let state="ready",reason="Verified ready";
  if(!next){state="gray";reason="No upcoming use scheduled"}
  if(issues.length){state="wip";reason=issues.length+" open task"+(issues.length>1?"s":"")}
  const atRisk=[...pendingReset,...pendingSetup].some(r=>{const d=deadlineOf(r);return d&&next&&d<=next.date})||pendingReset.some(r=>isOverdue(r));
  if(blockers.length){state="bad";reason=blockers.length+" blocker"+(blockers.length>1?"s":"")}
  else if(atRisk){state="bad";reason="Reset/setup due before next use"}
  if(!rm.lastReadyAt&&state==="ready"&&next)reason="Not yet verified";
  return{state,reason,issues,next,pendingReset};
}
/* ============ dashboard ============ */
function buildings(){return [...new Set(S.rooms.map(r=>r.building).filter(Boolean))]}
function dashRooms(){const f=S.dashFilter;return S.rooms.filter(r=>f.building==="all"||r.building===f.building)}
function renderDashboard(){
  const f=S.dashFilter;let R=S.requests.slice();
  if(f.priority!=="all")R=R.filter(r=>r.priority===f.priority);
  if(f.building!=="all")R=R.filter(r=>{const rm=room(r.roomId);return rm&&rm.building===f.building});
  const open=R.filter(isOpen),fresh=open.filter(r=>r.status==="new"),waiting=open.filter(r=>r.status==="awaiting_approval"),toVerify=open.filter(r=>r.status==="work_completed"),blocked=open.filter(r=>r.status==="blocked");
  const overdue=open.filter(isOverdue),unassigned=open.filter(r=>!r.assigneeId),resets=open.filter(r=>r.type==="reset"),urgent=open.filter(r=>r.priority==="urgent");
  const done30=R.filter(r=>r.status==="verified"&&r.verifiedAt>Date.now()-30*864e5);
  const rooms=dashRooms();const rr=rooms.map(roomReadiness);

  const loadHtml=Object.keys(load).length?Object.entries(load).sort((a,b)=>b[1]-a[1]).map(([id,n])=>'<div class="row" style="cursor:default"><span class="dot" style="--dot:var(--accent)"></span><span>'+esc(id==="_"?"Unassigned":nm(id))+'</span><span class="mono">'+n+'</span></div>').join(""):'<div class="empty">No open work assigned.</div>';

  const setup=!cfg().directorId?'<div class="banner warn" style="margin:0 0 16px">Routing isn\'t set up, so new requests have no owner. <a href="#routing">Open Setup</a> to choose the facilities director and approvers.</div>':"";

   '<div class="panel" style="margin-bottom:18px"><div class="panel-h"><h3>Campus readiness</h3><a class="btn sm" href="#sunday">Sunday readiness</a></div><div style="padding:14px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span class="pct" style="font-size:26px">'+pct+'%</span><span class="muted">'+ready+' ready · '+wip+' in progress · '+notReady+' not ready · '+gray+' idle</span></div><div class="readybar"><i style="width:'+(rooms.length?ready/rooms.length*100:0)+'%;background:var(--ready)"></i><i style="width:'+(rooms.length?wip/rooms.length*100:0)+'%;background:var(--wip)"></i><i style="width:'+(rooms.length?notReady/rooms.length*100:0)+'%;background:var(--bad)"></i></div></div></div>'+
   '<div class="tiles">'+tiles.map(([t,n,c,go])=>'<button class="tile '+c+'" data-go="'+go+'"><span class="n">'+n+'</span><span class="t">'+t+'</span></button>').join("")+'</div>'+

function card(r){return '<button class="card" style="--stripe:'+stripe(r)+'" data-open="'+esc(r.id)+'"><span class="mono muted">'+esc(r.number||"")+' · '+esc((TYPES[r.type]||TYPES.problem).label)+'</span><span class="ttl">'+esc(r.title)+'</span><span class="meta"><span>'+esc(roomName(r.roomId)||r.location||"")+'</span>'+(deadlineOf(r)?'<span'+(isOverdue(r)?' class="s-bad"':"")+'>'+esc(fmtDate(deadlineOf(r)))+'</span>':"")+(r.priority==="urgent"?'<span class="s-bad">Urgent</span>':"")+'<span>'+esc(r.assigneeId?nm(r.assigneeId):"Unassigned")+'</span></span></button>'}

/* ============ Sunday readiness ============ */
function renderSunday(){
  const sun=thisOrNextSunday();const thu=ymd(addDays(parseYmd(sun),-3));const now=todayYmd();
  const reqRooms=S.rooms.filter(r=>r.sundayRequired);
  const rr=reqRooms.map(rm=>({rm,r:roomReadiness(rm)}));
  const ready=rr.filter(x=>x.r.state==="ready").length;
  const pct=reqRooms.length?Math.round(ready/reqRooms.length*100):0;
  // changes after Thursday checkpoint that threaten Sunday
  const lateChanges=[];
  reqRooms.forEach(rm=>{roomUsesOn(rm.id,thu).forEach(u=>{if(u.date>=thu&&u.date<=sun&&u.kind!=="ministry"||(u.kind==="ministry"&&u.date>=thu&&u.date<sun)){
    const resets=S.requests.filter(r=>r.type==="reset"&&r.roomId===rm.id&&isOpen(r));
    lateChanges.push({rm,u,reset:resets[0],verified:resets.length===0})}})});
  const openResets=S.requests.filter(r=>r.type==="reset"&&isOpen(r));
  const highIssues=S.requests.filter(r=>isOpen(r)&&(r.priority==="urgent"||r.status==="blocked"));
  const lastSun=S.inspections.filter(i=>i.template==="sunday").sort((a,b)=>b.createdAt-a.createdAt)[0];

  const roomCard=({rm,r})=>'<button class="roomcard" style="--stripe:'+({ready:"var(--ready)",wip:"var(--wip)",bad:"var(--bad)",gray:"var(--gray)"}[r.state])+'" data-open-room="'+esc(rm.id)+'"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><b>'+esc(rm.name)+'</b><span class="chipstat '+r.state+'">'+({ready:"Ready",wip:"In progress",bad:"Not ready",gray:"Idle"}[r.state])+'</span></div><div class="muted" style="font-size:12.5px">'+esc(r.reason)+'</div><div class="sub" style="font-size:12px;color:var(--ink-3)">Next use: '+(r.next?esc(r.next.label)+" · "+esc(fmtDate(r.next.date)):"none scheduled")+'</div></button>';

  $("#v-sunday").innerHTML=
   '<div class="view-head"><div><h2>Sunday readiness</h2><p>Target Sunday <b>'+esc(fmtDate(sun))+'</b>. Thursday checkpoint '+esc(fmtDate(thu))+' at '+esc(cfg().thursdayTime||"2:00 PM")+'. A room verified Thursday returns to at-risk if a later event changes it before its reset is verified.</p></div><div class="btn-row"><a class="btn" href="#inspections">Run checkpoint</a></div></div>'+
   '<div class="tiles" style="grid-template-columns:repeat(4,minmax(0,1fr))">'+
    [["Sunday rooms ready",ready+"/"+reqRooms.length,ready===reqRooms.length&&reqRooms.length?"ok":"bad"],["Incomplete resets",openResets.length,openResets.length?"bad":"ok"],["Late changes to reverify",lateChanges.filter(x=>!x.verified).length,lateChanges.filter(x=>!x.verified).length?"bad":"ok"],["Open urgent / blocked",highIssues.length,highIssues.length?"bad":"ok"]].map(([t,n,c])=>'<div class="tile '+c+'"><span class="n">'+n+'</span><span class="t">'+t+'</span></div>').join("")+'</div>'+
   (lateChanges.filter(x=>!x.verified).length?'<div class="panel" style="margin-bottom:16px;border-color:var(--bad)"><div class="panel-h"><h3 style="color:var(--bad)">⚠ Changes after the Thursday checkpoint</h3></div><div class="panel-b">'+lateChanges.filter(x=>!x.verified).map(x=>'<div class="row" style="cursor:default"><span class="dot rd" style="--dot:var(--bad)"></span><span><b>'+esc(x.rm.name)+'</b> changed by <span>'+esc(x.u.label)+'</span><div class="sub">'+esc(fmtDate(x.u.date))+' · '+(x.reset?"reset "+STATUS[x.reset.status]+", due "+fmtDate(deadlineOf(x.reset)):"no reset task yet")+'</div></span>'+(x.reset?'<button class="btn sm" data-open="'+esc(x.reset.id)+'">Open reset</button>':'<button class="btn sm primary" data-make-reset="'+esc(x.rm.id)+'">Create reset</button>')+'</div>').join("")+'</div></div>':"")+
   '<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>Required Sunday spaces</h3><span class="muted">'+pct+'% ready</span></div><div style="padding:12px">'+(reqRooms.length?'<div class="roomgrid">'+rr.map(roomCard).join("")+'</div>':'<div class="empty"><strong>No rooms marked "required for Sunday"</strong>Edit a room under Rooms and check "Required for Sunday" to track it here.</div>')+'</div></div>'+
   '<div class="grid2"><div class="panel"><div class="panel-h"><h3>Incomplete resets</h3></div><div class="panel-b">'+(openResets.length?openResets.sort((a,b)=>(deadlineOf(a)||"9").localeCompare(deadlineOf(b)||"9")).map(r=>'<button class="row" data-open="'+esc(r.id)+'"><span class="dot" style="--dot:var(--c-reset)"></span><span>'+esc(r.title)+'<div class="sub">'+esc(roomName(r.roomId))+' · due '+esc(fmtDate(deadlineOf(r)))+(isOverdue(r)?" · OVERDUE":"")+'</div></span>'+pill(r.status)+'</button>').join(""):'<div class="empty">No open resets. Rooms return to standard after every event.</div>')+'</div></div>'+
   '<div class="panel"><div class="panel-h"><h3>Final verification</h3></div><div class="panel-b" style="padding:12px">'+(lastSun?'<p>Last Sunday checklist run '+esc(ago(lastSun.createdAt))+' by '+esc(nm(lastSun.byId))+' — '+lastSun.items.filter(i=>i.done).length+'/'+lastSun.items.length+' checked.</p>':'<p class="muted">No Sunday verification run yet.</p>')+'<a class="btn primary" href="#inspections">Run Sunday verification</a></div></div></div>';
}

function myOpenTasks(){const me=S.me.id;if(!me)return[];return S.requests.filter(r=>isOpen(r)&&(r.assigneeId===me||(r.status==="awaiting_approval"&&approverFor(r)===me)||(r.status==="work_completed"&&canVerify(r))))}
function renderMyTasks(){
  const me=S.me.id;
  if(!me){$("#v-mytasks").innerHTML='<div class="view-head"><div><h2>My tasks</h2></div></div><div class="empty"><strong>Sign in to see your tasks</strong></div>';return}
  const mine=myOpenTasks();const po={urgent:0,high:1,normal:2,low:3};
  mine.sort((a,b)=>(isOverdue(b)-isOverdue(a))||(po[a.priority]-po[b.priority])||((deadlineOf(a)||"9").localeCompare(deadlineOf(b)||"9")));
  const submitted=S.requests.filter(r=>r.requesterId===me).sort((a,b)=>b.createdAt-a.createdAt).slice(0,8);

   '<div class="panel"><div class="panel-h"><h3>Requests I submitted</h3></div><div class="panel-b">'+(submitted.length?submitted.map(r=>'<button class="row" data-open="'+esc(r.id)+'"><span class="dot" style="--dot:'+stripe(r)+'"></span><span>'+esc(r.title)+'<div class="sub">'+esc(r.number)+'</div></span>'+pill(r.status)+'</button>').join(""):'<div class="empty">You haven\'t submitted any requests.</div>')+'</div></div>';

async function shrink(file,max,q){const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",q))}finally{URL.revokeObjectURL(url)}}

  S.requests.forEach(r=>{if(r.status==="declined")return;const k=r.type;if(!S.calShow[k==="problem"?"problem":k])return;const dd=deadlineOf(r);if(dd!==day)return;
    out.push({kind:k==="problem"?"problem":k,key:"r:"+r.id,title:(k==="reset"?"Reset: ":k==="event_setup"?"Setup: ":"")+r.title,time:r.startTime?fmtTime(r.startTime):"",sort:r.startTime||(k==="reset"?"22:00":"23:00"),where:roomName(r.roomId)||r.location,done:r.status==="verified",urgent:r.priority==="urgent"||isOverdue(r)})});

/* ============ lifecycle actions ============ */
async function doAction(kind){
  const r=S.requests.find(x=>x.id===S.openId);if(!r||!S.db)return;
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
  const ref=S.db.doc("requests/"+r.id);const hist=(r.history||[]).slice();const now=Date.now();
  if(kind==="accept"){const who=v("aWho")||S.me.id;const cost=v("aCost");const need=needsApproval(r,cost);const note=v("aNote");
    const upd={assigneeId:who,deadline:v("aDate")||r.deadline,scheduledFor:v("aDate"),estCost:cost,status:need?"awaiting_approval":"approved",acceptedAt:now,acceptedBy:S.me.id};
    hist.push({at:now,by:S.me.id,action:need?"Accepted, sent for approval":"Accepted & approved",note});
    await ref.update(Object.assign(upd,{history:hist,updatedAt:now}));
    await notify([r.requesterId],r,"Your request was accepted"+(need?" and sent for approval":" and scheduled"),note);
    if(need)await notify([approverFor(r)],r,"A request needs your approval",note);else if(who!==S.me.id)await notify([who],r,"Work assigned to you",note);
    toast(need?"Sent to "+nm(approverFor(r))+" for approval.":"Accepted.");}
  else if(kind==="approve"){const amt=v("aAmt");const note=v("aNote");hist.push({at:now,by:S.me.id,action:"Approved"+(amt?" ($"+amt+")":""),note});
    await ref.update({status:"approved",approvedBy:S.me.id,approvedAmount:amt,approvedAt:now,history:hist,updatedAt:now});
    await notify([r.requesterId,r.assigneeId,cfg().ccDirector!==false?cfg().directorId:null],r,"Request approved",note);toast("Approved.");}
  else if(kind==="decline"){showInline('Decline request','dNote','Reason (sent to requester)','decline-confirm','Decline');return}
  else if(kind==="decline-confirm"){const note=v("dNote");if(!note){toast("Add a reason.");return}hist.push({at:now,by:S.me.id,action:"Declined",note});
    await ref.update({status:"declined",history:hist,updatedAt:now});await notify([r.requesterId,r.assigneeId],r,"Request declined",note);toast("Declined.");}
  else if(kind==="block"){showInline('Mark blocked','bNote','What is blocking it?','block-confirm','Mark blocked');return}
  else if(kind==="block-confirm"){const note=v("bNote");hist.push({at:now,by:S.me.id,action:"Blocked",note});await ref.update({status:"blocked",history:hist,updatedAt:now});await notify([r.requesterId,cfg().directorId],r,"Request blocked",note);toast("Marked blocked. Leadership notified.");}
  else if(kind==="unblock"){hist.push({at:now,by:S.me.id,action:"Unblocked"});await ref.update({status:"approved",history:hist,updatedAt:now});toast("Unblocked.");}
  else if(kind==="complete"){const note=v("cNote");if(!note){toast("Add a short note about what was done.");return}
    const fi=document.getElementById("cPhotos");let after=[];if(fi&&fi.files.length){toast("Uploading photos…");const list=[];for(const f of[...fi.files].slice(0,6)){try{const b=await shrink(f,1600,.82);list.push({blob:b})}catch(e){}}after=await storePhotos(list)}
    const skipV=!requireVerify(r);hist.push({at:now,by:S.me.id,action:skipV?"Completed":"Completed — sent for verification",note});
    await ref.update({status:skipV?"verified":"work_completed",completionNote:note,actualCost:v("cCost"),afterPhotos:(r.afterPhotos||[]).concat(after),completedAt:now,completedBy:S.me.id,verifiedAt:skipV?now:null,history:hist,updatedAt:now});
    if(skipV){await afterVerify(r);await notify([r.requesterId],r,"Request completed",note)}else await notify([verifierFor(r),r.requesterId],r,"Work done — needs verification",note);
    toast(skipV?"Completed.":"Sent to "+nm(verifierFor(r))+" to verify.");}
  else if(kind==="verify"){const note=v("vNote");hist.push({at:now,by:S.me.id,action:"Verified & closed",note});
    await ref.update({status:"verified",verifiedBy:S.me.id,verifyNote:note,verifiedAt:now,history:hist,updatedAt:now});
    await afterVerify(Object.assign({},r,{status:"verified"}));await notify([r.requesterId,r.assigneeId],r,"Verified — ready",note);toast("Verified & closed.");}
  else if(kind==="reject"){showInline('Send back','rjNote','What still needs doing?','reject-confirm','Send back');return}
  else if(kind==="reject-confirm"){const note=v("rjNote");if(!note){toast("Add what's needed.");return}hist.push({at:now,by:S.me.id,action:"Sent back — not verified",note});await ref.update({status:"approved",history:hist,updatedAt:now});await notify([r.assigneeId],r,"Sent back — needs more work",note);toast("Sent back to "+nm(r.assigneeId)+".");}
  else if(kind==="reassign"){const who=v("xWho");const d=v("xDate");hist.push({at:now,by:S.me.id,action:"Assignment updated",note:(who?"Assigned "+nm(who):"Unassigned")+(d?" · "+fmtDate(d):"")});
    await ref.update({assigneeId:who||null,deadline:d||r.deadline,scheduledFor:d,history:hist,updatedAt:now});if(who&&who!==r.assigneeId)await notify([who],r,"Work assigned to you");toast("Saved.");}
  else if(kind==="reopen"){hist.push({at:now,by:S.me.id,action:"Reopened"});await ref.update({status:"approved",verifiedAt:null,history:hist,updatedAt:now});await notify([r.assigneeId],r,"Request reopened");toast("Reopened.");}
  else if(kind==="comment"){const note=v("mNote");if(!note)return;hist.push({at:now,by:S.me.id,action:"Comment",note});await ref.update({history:hist,updatedAt:now});await notify([r.requesterId,r.assigneeId,approverFor(r)],r,"New comment",note);const el=document.getElementById("mNote");if(el)el.value="";toast("Posted.");}
}
// after a request is verified: if event setup that changes config, auto-create the reset; mark room ready
async function afterVerify(r){
  if(r.roomId){try{await S.db.doc("rooms/"+r.roomId).update({lastReadyAt:Date.now(),lastReadyBy:S.me.id,readiness:"ready"}).catch(()=>{})}catch(e){}}
  if(r.type==="event_setup"&&r.changesConfig&&!r.resetId){await createReset(r)}
}
async function createReset(parent){
  const rm=room(parent.roomId);
  // deadline = next use of the room after this event, capped at Sunday if required
  const after=parent.eventDate||todayYmd();
  const uses=roomUsesOn(parent.roomId,ymd(addDays(parseYmd(after),1)));
  let deadline=uses[0]?uses[0].date:ymd(addDays(parseYmd(after),1));
  if(rm&&rm.sundayRequired){const sun=nextSunday(parseYmd(after));if(sun<deadline)deadline=sun}
  const now=Date.now();
  const reset={number:woNum("RS"),type:"reset",title:"Reset: "+(rm?rm.name:parent.title),description:"Return "+(rm?rm.name:"the room")+" to standard after "+parent.title+".",
    roomId:parent.roomId,location:parent.location||"",category:"Custodial",priority:"high",deadline,resetReason:"Return to standard after an event",
    parentId:parent.id,photos:[],checklist:defaultChecklist("reset",parent.roomId),status:"new",requesterId:S.me.id,contactName:"Auto-created",ministry:"Facilities",
    createdAt:now,updatedAt:now,history:[{at:now,by:S.me.id,action:"Auto-created from event "+parent.number}]};
  reset.assigneeId=acceptorFor(reset);reset.verifierId=verifierFor(reset);
  try{const ref=await S.db.collection("requests").add(reset);await S.db.doc("requests/"+parent.id).update({resetId:ref.id}).catch(()=>{});
    await notify([reset.assigneeId,cfg().directorId],Object.assign({id:ref.id},reset),"Post-event reset created — due "+fmtDate(deadline));toast("Reset "+reset.number+" created, due "+fmtDate(deadline)+".")}catch(e){toast("Couldn't auto-create the reset.")}
}

async function toggleCheck(i){const r=S.requests.find(x=>x.id===S.openId);if(!r||!canAct(r))return;const cl=(r.checklist||[]).map(c=>Object.assign({},c));if(!cl[i])return;cl[i].done=!cl[i].done;try{await S.db.doc("requests/"+r.id).update({checklist:cl,updatedAt:Date.now()})}catch(e){toast("Couldn't save checklist.")}}

   '<div class="panel" style="padding:14px"><ol style="margin:0;padding-left:20px;color:var(--ink-2);display:grid;gap:4px"><li><b>Submitted</b> → category owner (or director).</li><li><b>Assigned</b> → owner assigns & schedules; repairs at/over the limit and event setups go to an approver.</li><li><b>Done</b> → the assignee marks work complete with notes/photos.</li><li><b>Verified</b> → a verifier confirms the room is actually ready, then it closes. Event setups that change a room auto-create a post-event reset.</li></ol></div>'+
   '<fieldset><legend>People</legend><div class="fgrid">'+pick("directorId","Facilities director","Sees everything; fallback for every step.")+pick("eventCoordinatorId","Event setup coordinator","Accepts event & room-setup requests.")+pick("eventApproverId","Event approver","Approves event setups.")+pick("maintenanceApproverId","Maintenance approver","Approves repairs at/over the cost limit.")+pick("resetOwnerId","Default reset owner","Takes resets when the room has no owner.")+'</div></fieldset>'+
   '<fieldset><legend>Rules</legend><div class="fgrid"><div class="f"><label for="cfThr">Cost needing approval ($)</label><input id="cfThr" type="number" min="1" value="'+esc(c.costThreshold||500)+'"'+(can?"":" disabled")+'></div><div class="f"><label for="cfThu">Thursday checkpoint time</label><input id="cfThu" value="'+esc(c.thursdayTime||"2:00 PM")+'"'+(can?"":" disabled")+'></div></div><div style="display:grid;gap:8px;margin-top:10px"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cfCc"'+(c.ccDirector!==false?" checked":"")+(can?"":" disabled")+'> Copy the director on new, approved and completed requests</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cfVer"'+(c.verifyAll!==false?" checked":"")+(can?"":" disabled")+'> Require verification on repairs too (always required for setups & resets)</label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cfEvAp"'+(c.eventsNeedApproval!==false?" checked":"")+(can?"":" disabled")+'> Event setups need approval before scheduling</label></div></fieldset>'+
   '<fieldset><legend>Maintenance category owners</legend><p class="muted" style="margin:0 0 10px">Requests in each category go to this person. Blank = director.</p><div class="fgrid">'+CATEGORIES.map(cat=>pick("cat:"+cat,cat)).join("")+'</div></fieldset>'+
   '<fieldset><legend>Support request owners</legend><p class="muted" style="margin:0 0 10px">Who receives IT, security, communications and other support requests. Blank = director.</p><div class="fgrid">'+SERVICE_TYPES.map(sv=>pick("svc:"+sv,sv)).join("")+'</div></fieldset>'+
   '<fieldset><legend>Facilities team</legend><p class="muted" style="margin:0 0 10px">Extra people who can be assigned work (custodians, contractors, volunteers).</p>'+(can?'<div class="picker f"><input data-picker="team" placeholder="Add a person…" autocomplete="off"><div class="res" hidden></div></div>':"")+'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+(team.length?team.map(id=>'<span class="chip" style="cursor:default">'+esc(nm(id))+(can?' <button type="button" class="btn sm" style="padding:0 6px" data-unteam="'+esc(id)+'" aria-label="Remove">×</button>':"")+'</span>').join(""):'<span class="muted">No extra team members.</span>')+'</div></fieldset>'+
   (can?'<div style="display:flex;gap:10px;align-items:center"><button class="btn primary" type="submit">Save routing</button><span class="muted" id="cfMsg"></span></div>':"")+
   '<div class="banner" style="margin-top:4px"><b>Permissions note:</b> this hub stores data in the artifact database, which enforces access <b>by share level</b> — room standards and this Setup page are locked to editors (real enforcement). It cannot enforce per-request rules (e.g. "only this verifier may verify #123"); those are guided in the interface only. For audited, per-record permissions in production, move the data to a backend with row-level security (see launch notes).</div></form>';
  const f=$("#routingForm");if(f)f.onsubmit=saveRouting;
}
async function saveRouting(e){e.preventDefault();const c=Object.assign({},cfg());
  ["directorId","eventCoordinatorId","eventApproverId","maintenanceApproverId","resetOwnerId"].forEach(k=>{c[k]=pickVal(k)||null});
  c.categoryAssignees={};CATEGORIES.forEach(cat=>{const v=pickVal("cat:"+cat);if(v)c.categoryAssignees[cat]=v});
  c.serviceOwners={};SERVICE_TYPES.forEach(sv=>{const v=pickVal("svc:"+sv);if(v)c.serviceOwners[sv]=v});
  c.team=pickerState.team!==undefined?pickerState.team:(c.team||[]);c.costThreshold=Number($("#cfThr").value)||500;c.thursdayTime=$("#cfThu").value||"2:00 PM";c.ccDirector=$("#cfCc").checked;c.verifyAll=$("#cfVer").checked;c.eventsNeedApproval=$("#cfEvAp").checked;c.updatedAt=Date.now();
  try{await S.db.doc("config/routing").set(c);Object.keys(pickerState).forEach(k=>delete pickerState[k]);toast("Routing saved.")}catch(err){$("#cfMsg").textContent="Couldn't save. Only the hub owner and editors can change routing."}}
let searchT=null;
document.addEventListener("input",e=>{const inp=e.target.closest("[data-picker]");if(!inp||!S.user)return;const box=inp.parentElement.querySelector(".res");clearTimeout(searchT);
  searchT=setTimeout(async()=>{let res=[];try{res=await S.user.search(inp.value)}catch(err){}res.forEach(p=>S.profiles[p.id]=p);
    box.innerHTML=res.length?res.slice(0,8).map(p=>'<button type="button" data-pickid="'+esc(p.id)+'">'+esc(p.name||"Someone")+(p.email?' <span class="muted">'+esc(p.email)+'</span>':"")+'</button>').join(""):'<div class="muted" style="padding:8px 10px">No one found. People must have access to this hub.</div>';box.hidden=false},200)});
document.addEventListener("focusin",e=>{const inp=e.target.closest&&e.target.closest("[data-picker]");if(inp&&!inp.value)inp.dispatchEvent(new Event("input",{bubbles:true}))});

/* ============ global clicks ============ */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a,[data-scrim]");if(!t)return;const d=t.dataset;
  if(t.hasAttribute("data-scrim")){if(e.target===t)closeModal();return}
  if(d.pickid){const inp=t.closest(".picker").querySelector("input");const key=inp.dataset.picker;if(key==="team"){const cur=pickerState.team!==undefined?pickerState.team:(cfg().team||[]).slice();if(!cur.includes(d.pickid))cur.push(d.pickid);pickerState.team=cur}else pickerState[key]=d.pickid;S.view==="rooms"?renderRooms():renderRouting();return}
  if(d.unpick){pickerState[d.unpick]=null;S.view==="rooms"?renderRooms():renderRouting();return}
  if(d.unteam){pickerState.team=(pickerState.team!==undefined?pickerState.team:(cfg().team||[])).filter(x=>x!==d.unteam);renderRouting();return}
  if(d.open){openDetail(d.open);return}
  if(d.openRoom){openRoomDetail(d.openRoom);return}
  if(d.openCal){openCalKey(d.openCal);return}
  if(d.openN){const n=S.notifs.find(x=>x.id===d.openN);if(n){if(!n.read)S.db.doc("notifications/"+n.id).update({read:true}).catch(()=>{});openDetail(n.requestId)}return}
  if(d.go){const[v,st]=d.go.split(":");if(v==="sunday"||v==="preventive"){location.hash="#"+v;return}S.woFilter=Object.assign(S.woFilter,{status:st||"open",q:"",type:"all",room:"all",mine:false});location.hash="#"+v;return}
  if(d.makeReset){const rm=room(d.makeReset);const fake={type:"reset",roomId:d.makeReset,eventDate:todayYmd(),title:rm?rm.name:"",changesConfig:true,number:"(manual)",id:"manual"};await createReset(fake);return}
  if(t.hasAttribute("data-close")){if(d.prefillDate)prefill={type:"event_setup",eventDate:d.prefillDate};if(d.prefillRoom)prefill={type:d.prefillType||"reset",roomId:d.prefillRoom};if(d.roomEdit){S.roomEditing=d.roomEdit}closeModal();if((d.prefillDate||d.prefillRoom)&&S.view==="request")renderRequestForm();if(d.roomEdit&&S.view==="rooms")renderRooms();return}
  if(d.linkPco){const e2=allPcoEvents().find(x=>x.id===d.linkPco);if(e2){const rm=S.rooms.find(r=>(e2.l||"").toLowerCase().includes((r.name||"").toLowerCase()));prefill={type:"event_setup",title:"Setup: "+e2.n,eventDate:ymd(new Date(e2.s)),pcoEventId:e2.id,roomId:rm?rm.id:""}}closeModal();if(S.view==="request")renderRequestForm();else location.hash="#request";return}
  if(t.hasAttribute("data-rerender")){renderDetail();return}
  if(d.do){t.disabled=true;try{await doAction(d.do)}catch(err){toast(err&&err.code==="invalid_argument"?"You don't have permission to change this.":"That didn't save. Try again.")}finally{t.disabled=false}return}
  if(d.check!==undefined){toggleCheck(Number(d.check));return}
  if(d.copy){try{await navigator.clipboard.writeText(d.copy);toast("Copied "+d.copy)}catch(err){toast(d.copy)}return}
  if(d.rmphoto!==undefined){S.draftPhotos.splice(Number(d.rmphoto),1);drawThumbs();return}
  if(d.toggle){S.calShow[d.toggle]=!S.calShow[d.toggle];savePrefs();renderCalendar();return}
  if(d.cal!==undefined){const n=Number(d.cal);if(n===0)S.calMonth=monthKey(new Date());else{const[y,m]=S.calMonth.split("-").map(Number);S.calMonth=monthKey(new Date(y,m-1+n,1))}renderCalendar();ensureMonth(S.calMonth);return}
  if(d.calmode){S.calMode=d.calmode;savePrefs();renderCalendar();return}
  if(d.day){openDay(d.day);return}
  if(d.act==="pco-load"){S.pcoState._needsClick=false;const mk=S.view==="calendar"?S.calMonth:monthKey(new Date());delete S.pcoState[mk];ensureMonth(mk,true);return}
  if(d.act==="read-all"){for(const n of S.notifs.filter(n=>!n.read))await S.db.doc("notifications/"+n.id).update({read:true}).catch(()=>{});return}
  if(d.act==="clear-read"){for(const n of S.notifs.filter(n=>n.read))await S.db.doc("notifications/"+n.id).delete().catch(()=>{});toast("Cleared.");return}
  // rooms
  if(t.hasAttribute("data-room-new")){S.roomEditing="new";renderRooms();const el=$("#rmName");el&&el.focus();return}
  if(d.roomEdit){S.roomEditing=d.roomEdit;renderRooms();window.scrollTo(0,0);return}
  if(t.hasAttribute("data-room-cancel")){S.roomEditing=null;delete pickerState.room;renderRooms();return}
  if(d.roomDel){if(t.dataset.armed){await S.db.doc("rooms/"+d.roomDel).delete().catch(()=>toast("Couldn't delete."));S.roomEditing=null;renderRooms()}else{t.dataset.armed="1";t.textContent="Click again to delete"}return}
  if(t.hasAttribute("data-rooms-starter")){t.disabled=true;for(const[name,building,capacity,standardConfig,ministry,sundayRequired] of STARTER_ROOMS)await S.db.collection("rooms").add({name,building,capacity,standardConfig,ministry,sundayRequired,tables:"",chairs:"",instructions:"",createdAt:Date.now(),updatedAt:Date.now()}).catch(()=>{});toast("Starter rooms added. Edit each to add photos, owners and inventory.");return}
  // inspections
  if(d.inspStart){inspRun={template:d.inspStart,items:INSPECTION_TEMPLATES[d.inspStart].items.map(t=>({t,done:false})),area:"",notes:""};renderInspections();return}
  if(d.inspCheck!==undefined){const i=Number(d.inspCheck);if(inspRun){inspRun.area=($("#iArea")||{}).value||"";inspRun.notes=($("#iNotes")||{}).value||"";inspRun.items[i].done=!inspRun.items[i].done;renderInspections()}return}
  if(d.inspFix!==undefined){await inspFix(Number(d.inspFix));return}
  if(t.hasAttribute("data-insp-save")){await saveInspection();return}
  if(t.hasAttribute("data-insp-cancel")){inspRun=null;renderInspections();return}
  // pm
  if(t.hasAttribute("data-pm-new")){S.pmEditing="new";renderPM();const el=$("#pTitle");el&&el.focus();return}
  if(d.pmEdit){S.pmEditing=d.pmEdit;renderPM();return}
  if(t.hasAttribute("data-pm-cancel")){S.pmEditing=null;renderPM();return}
  if(d.pmDel){if(t.dataset.armed){await S.db.doc("pm/"+d.pmDel).delete().catch(()=>toast("Couldn't delete."));S.pmEditing=null;renderPM()}else{t.dataset.armed="1";t.textContent="Click again to delete"}return}
  if(d.pmDone){const p=S.pm.find(x=>x.id===d.pmDone);await S.db.doc("pm/"+p.id).update({lastDone:todayYmd(),lastDoneBy:S.me.id,updatedAt:Date.now()}).catch(()=>toast("Couldn't save."));toast("Logged. Next due "+fmtDate(ymd(addDays(new Date(),Number(p.frequencyDays)||30))));return}
  if(d.pmWo){const p=S.pm.find(x=>x.id===d.pmWo);const now=Date.now();const r={number:woNum("WO"),type:"problem",title:p.title,description:(p.notes||"")+"\n\nFrom the preventive schedule.",roomId:"",location:p.location||"",category:p.category||"General Repair",priority:pmState(p)==="overdue"?"high":"normal",deadline:pmNext(p),photos:[],checklist:[],status:"new",requesterId:S.me.id,contactName:S.me.name||"",ministry:"Facilities",createdAt:now,updatedAt:now,source:"pm",pmId:p.id,history:[{at:now,by:S.me.id,action:"Created from preventive schedule"}]};r.assigneeId=p.assigneeId||acceptorFor(r);r.verifierId=verifierFor(r);try{const ref=await S.db.collection("requests").add(r);await notify([r.assigneeId],Object.assign({id:ref.id},r),"Preventive work order assigned");toast("Work order "+r.number+" created.")}catch(err){toast("Couldn't create.")}return}
  if(t.hasAttribute("data-pm-starter")){t.disabled=true;for(const[title,location,category,freq] of STARTER_PM)await S.db.collection("pm").add({title,location,category,frequencyDays:freq,lastDone:"",assigneeId:null,notes:"",createdAt:Date.now(),updatedAt:Date.now()}).catch(()=>{});toast("Added. Set each last-done date; trim what doesn't apply.");return}
  // reports
  if(d.export){await doExport(d.export);return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modalRoot").innerHTML)closeModal()});
document.addEventListener("click",e=>{if(!e.target.closest(".picker"))document.querySelectorAll(".picker .res").forEach(b=>b.hidden=true)},true);
// room form submit (delegated since form is re-rendered)
document.addEventListener("submit",e=>{if(e.target.id==="roomForm")saveRoom(e)});
boot();
</script>
